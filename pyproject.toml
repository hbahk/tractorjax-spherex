[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-photometry"
dynamic = ["version"]
description = "Forced photometry and spectrophotometry from SPHEREx L2 spectral images"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Hyeonguk Bahk", email = "bahkhyeonguk@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# NOTE: `tractor-jax` and `spherex-retrieval` are REQUIRED at runtime but are
# not on PyPI yet, so they are intentionally omitted here (see docs/installation).
# Install them first from source, then `pip install spherex-photometry` (or
# `pip install -e . --no-deps` for local development). A helpful error is raised
# at import time if either is missing.
dependencies = [
    "numpy",
    "scipy",
    "astropy>=6.0",
    "photutils",
    "pyarrow",
    "tqdm",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/hbahk/spherex-photometry"
Documentation = "https://spherex-photometry.readthedocs.io"
Source = "https://github.com/hbahk/spherex-photometry"

[project.optional-dependencies]
# GPU: tractor-jax pulls plain (CPU) jax; this upgrades to the CUDA 12 build.
gpu = ["jax[cuda12]"]
# Reference-catalog fetcher (NOIRLab Data Lab / Legacy Survey DR10).
catalog = ["astro-datalab"]
# Spectrum / diagnostic plotting.
plot = ["matplotlib"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-copybutton",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "matplotlib",
    "ruff",
]

[project.scripts]
spherex-phot = "spherex_photometry.cli:main"

[tool.setuptools.dynamic]
version = { attr = "spherex_photometry.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["spherex_photometry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: tests that need real (non-bundled) SPHEREx cutouts on disk",
    "cpu_tractor: tests that need the optional upstream `tractor` package",
]
