[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tractorjax-spherex"
dynamic = ["version"]
description = "Forced photometry and spectrophotometry from SPHEREx L2 spectral images"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Hyeonguk Bahk", email = "bahkhyeonguk@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# NOTE: `tractor-jax` and `spherex-retrieval` are REQUIRED at runtime but are
# not on PyPI yet, so they are intentionally omitted here (see docs/installation).
# Install them first from source, then `pip install tractorjax-spherex` (or
# `pip install -e . --no-deps` for local development). A helpful error is raised
# at import time if either is missing.
dependencies = [
    "numpy",
    "scipy",
    "astropy>=6.0",
    "photutils",
    "pyarrow",
    "tqdm",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/hbahk/tractorjax-spherex"
Documentation = "https://tractorjax-spherex.readthedocs.io"
Source = "https://github.com/hbahk/tractorjax-spherex"

[project.optional-dependencies]
# GPU: tractor-jax pulls plain (CPU) jax; this upgrades to the CUDA 12 build.
gpu = ["jax[cuda12]"]
# Faster cutout reading (cfitsio). Optional: without it the astropy reader runs
# unchanged and returns the identical Cutout — this only buys speed (~4x on the
# per-cutout read). See tractorjax_spherex.io.fast.
fast = ["fitsio"]
# Reference-catalog fetcher (NOIRLab Data Lab / Legacy Survey DR10).
catalog = ["astro-datalab"]
# Spectrum / diagnostic plotting.
plot = ["matplotlib"]
docs = [
    "sphinx>=7",
    "shibuya",
    # myst-nb (which bundles myst-parser) renders the executed example
    # notebooks; execution is off in conf.py, so no kernel is needed to build.
    "myst-nb",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "matplotlib",
    # so tests/test_io_fast.py actually runs (it skips without fitsio)
    "fitsio",
    # Ruff's *default* rule set widens between minor releases (0.16 added isort,
    # bugbear, pyupgrade, ... on top of the old E/F set), so an unpinned ruff
    # silently redefines what CI lints. Bump this deliberately, not by accident.
    "ruff>=0.16,<0.17",
]

[project.scripts]
tractorjax-spherex = "tractorjax_spherex.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tractorjax_spherex.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tractorjax_spherex*"]

[tool.setuptools.package-data]
"tractorjax_spherex.calib" = ["*.ecsv"]

[tool.ruff.lint]
# Rules kept off on purpose (everything else is ruff's default set for the
# pinned version above).
ignore = [
    "C408",  # dict(flux=..., err=...) reads better than a quoted literal for
             # the keyword-style records the backends pass around.
]

[tool.ruff.lint.isort]
# `fixtures` is the tests' own helper package, not a third-party dependency.
known-first-party = ["tractorjax_spherex", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: tests that need real (non-bundled) SPHEREx cutouts on disk",
    "cpu_tractor: tests that need the optional upstream `tractor` package",
]
