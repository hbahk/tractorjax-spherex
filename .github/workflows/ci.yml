name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests run entirely on the JAX CPU backend.
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine + package
        run: |
          python -m pip install --upgrade pip
          # tractor-jax is not on PyPI; install from source for CI.
          pip install "tractor-jax @ git+https://github.com/hbahk/tractor-jax"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (CPU JAX; cpu-tractor tests skip without upstream tractor)
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install "tractor-jax @ git+https://github.com/hbahk/tractor-jax"
          pip install -e ".[docs]"
          sphinx-build -W -b html docs docs/_build/html
